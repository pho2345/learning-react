name: Deploy Staging with Logs

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH with detailed logs
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST_STAGING }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "===== CONNECTED TO EC2 ====="

            cd /home/ubuntu/learning-react

            if [ ! -d ".git" ]; then
              echo "===== First deploy → clone repo ====="
              git clone -b staging git@github.com:pho2345/learning-react.git .
            else
              echo "===== Pull latest code ====="
              git pull origin staging
            fi

            echo "===== Check Node.js ====="
            if ! command -v node &> /dev/null; then
              echo "Node not found, installing Node 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            echo "Node version:"
            node -v

            echo "===== Check pnpm ====="
            if ! command -v pnpm &> /dev/null; then
              echo "pnpm not found, installing..."
              sudo npm install -g pnpm
            fi

            echo "pnpm version:"
            pnpm -v

            echo "===== Installing dependencies ====="
            pnpm install

            echo "===== Building project ====="
            pnpm build

            echo "===== Starting project with PM2 ====="
            pm2 reload myapp-staging || pm2 start pnpm --name "myapp-staging" -- start

            echo "✅ DEPLOY FINISHED SUCCESSFULLY"
