name: Deploy Staging with Logs

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH with detailed logs
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST_STAGING }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -x   # in ra từng lệnh bash đang chạy

            echo "===== Start deploy ====="
            echo "Current user: $(whoami)"
            echo "Current directory: $(pwd)"
            cd /home/ubuntu/learning-react || { echo "Directory not found"; exit 1; }
            echo "Listing files in current directory:"
            ls -la

            if [ ! -d ".git" ]; then
              echo "First deploy → clone repo"
              git clone -b staging git@github.com:pho2345/learning-react.git .
            else
              echo "Pull latest changes"
              git pull origin staging
            fi

            echo "===== Installing dependencies ====="
            pnpm install

            echo "===== Building project ====="
            pnpm build

            echo "===== Starting project ====="
            pnpm start

            echo "===== Deploy finished ====="
